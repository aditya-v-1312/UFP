<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - UFP Portal</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #c32033, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .register-box {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
      width: 320px;
    }
    .register-box h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }
    .register-box input[type="text"],
    .register-box input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    .register-box input[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #c32033;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    .register-box input[type="submit"]:hover {
      background-color: #000000;
    }
    .register-box p {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="register-box">
    <h2>Create Account</h2>
    <form action="/register" method="POST">
      <input type="text" name="username" placeholder="Student ID (8 digits)" required pattern="\d{8}">
      <input type="password" name="password" placeholder="Password (Your Name)" required>
      <input type="submit" value="Register">
    </form>
    <p>Already have an account? <a href="/">Login here</a></p>
  </div>

</body>
</html>
